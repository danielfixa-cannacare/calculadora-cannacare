<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A4FB8">
<style>*{margin:0}html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Calculadora CannaCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#F4F1FA;
    --surface:#FFFFFF;
    --surface-2:#F7F3FC;
    --ink:#241633;
    --muted:#6C6180;
    --line:#E6DEF4;
    --brand:#7A4FB8;
    --brand-strong:#673FA6;
    --brand-soft:#F1EAFB;
    --lilac:#B9A6E8;
    --lilac-ink:#3F2470;
    --ok-bg:#E4F1E8; --ok-ink:#1c6b3c; --ok-dot:#2e9e5b;
    --warn-bg:#FBEFD6; --warn-ink:#8a6212; --warn-dot:#e0a21b;
    --crit-bg:#FBE4E1; --crit-ink:#9a362b; --crit-dot:#cf4a3a;
    --shadow:0 1px 2px rgba(36,22,51,.05),0 10px 26px rgba(67,32,106,.08);
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#150D22;--surface:#1E1430;--surface-2:#251A3A;--ink:#EEE8F7;--muted:#A99CC1;
      --line:#33254C;--brand:#B79BEA;--brand-strong:#CDB8F6;--brand-soft:#291B41;--lilac:#8E77C9;--lilac-ink:#EbE3F9;
      --ok-bg:#173026;--ok-ink:#7fd6a1;--ok-dot:#43c07e;
      --warn-bg:#332813;--warn-ink:#e9c069;--warn-dot:#e0a21b;
      --crit-bg:#341c19;--crit-ink:#f0a498;--crit-dot:#e0664f;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ground:#150D22;--surface:#1E1430;--surface-2:#251A3A;--ink:#EEE8F7;--muted:#A99CC1;
    --line:#33254C;--brand:#B79BEA;--brand-strong:#CDB8F6;--brand-soft:#291B41;--lilac:#8E77C9;--lilac-ink:#EbE3F9;
    --ok-bg:#173026;--ok-ink:#7fd6a1;--ok-dot:#43c07e;
    --warn-bg:#332813;--warn-ink:#e9c069;--warn-dot:#e0a21b;
    --crit-bg:#341c19;--crit-ink:#f0a498;--crit-dot:#e0664f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);
    font-family:"Figtree",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:500px;margin:0 auto;padding:18px 16px 40px;}

  /* Header */
  header.top{background:linear-gradient(155deg,#A57CE0 0%,#8A5FCB 48%,#7A4FB8 100%);
    color:#fff;border-radius:20px;padding:26px 22px 24px;position:relative;overflow:hidden;
    box-shadow:var(--shadow);text-align:center}
  header.top::before{content:"";position:absolute;left:-50px;bottom:-70px;width:190px;height:190px;
    border-radius:50%;background:rgba(255,255,255,.06)}
  header.top::after{content:"";position:absolute;right:-46px;top:-56px;width:150px;height:150px;
    border-radius:50%;background:rgba(255,255,255,.07)}
  .logo{height:38px;width:auto;position:relative;z-index:1;
    filter:brightness(0) invert(1);}
  .htitle{position:relative;z-index:1;margin-top:12px;font-family:"Fraunces",Georgia,serif;
    font-style:italic;font-weight:600;font-size:20px;color:#fff;letter-spacing:.2px}
  .hsub{position:relative;z-index:1;margin-top:2px;font-size:12px;letter-spacing:2.5px;
    text-transform:uppercase;color:rgba(255,255,255,.72)}
  .themebtn{position:absolute;top:16px;right:16px;z-index:3;background:rgba(255,255,255,.15);
    border:none;color:#fff;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;
    display:grid;place-items:center}
  .themebtn:hover{background:rgba(255,255,255,.26)}

  /* Tabs */
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:13px;padding:5px;margin:16px 0;box-shadow:var(--shadow)}
  .tab{flex:1;border:none;background:transparent;color:var(--muted);font-family:inherit;
    font-weight:600;font-size:14.5px;padding:11px 8px;border-radius:9px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,color .15s}
  .tab[aria-selected="true"]{background:var(--brand);color:#fff}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;box-shadow:var(--shadow)}
  .panel{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 14px 16px;margin-bottom:14px}
  .panel-title{font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
    color:var(--brand);margin:0 0 12px}
  .grp{margin-bottom:13px}
  .grp:last-child{margin-bottom:0}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  label{display:block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px}
  input,select{width:100%;font-family:inherit;font-size:15.5px;color:var(--ink);background:var(--surface);
    border:1.5px solid var(--line);border-radius:10px;padding:12px 12px;transition:border-color .15s,box-shadow .15s;
    -webkit-appearance:none;appearance:none}
  input::placeholder{color:#a79cbb}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236C6180' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:38px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}

  button.cta{width:100%;border:none;border-radius:12px;font-family:inherit;font-weight:700;font-size:15.5px;
    color:#fff;background:var(--brand);padding:15px;cursor:pointer;margin-top:4px;letter-spacing:.2px;
    transition:background .15s,transform .05s}
  button.cta:hover{background:var(--brand-strong)}
  button.cta:active{transform:translateY(1px)}
  button.cta.soft{background:var(--lilac);color:var(--lilac-ink)}
  button.cta.soft:hover{filter:brightness(.96)}
  button.cta:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11.5px;
    font-weight:700;letter-spacing:1px;margin:16px 2px}
  .divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}

  /* Result */
  .result{margin-top:16px;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;
    box-shadow:var(--shadow)}
  .result-status{display:flex;align-items:center;gap:9px;padding:13px 16px;font-weight:700;font-size:14.5px}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .st-ok{background:var(--ok-bg);color:var(--ok-ink)} .st-ok .dot{background:var(--ok-dot)}
  .st-warn{background:var(--warn-bg);color:var(--warn-ink)} .st-warn .dot{background:var(--warn-dot)}
  .st-crit{background:var(--crit-bg);color:var(--crit-ink)} .st-crit .dot{background:var(--crit-dot)}
  .result-body{background:var(--surface);padding:16px}
  .big{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .big .num{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:40px;line-height:1;color:var(--brand);
    font-variant-numeric:tabular-nums}
  .big .unit{font-size:14px;color:var(--muted);font-weight:600}
  .big.crit .num{color:var(--crit-ink)}
  .kv{display:grid;grid-template-columns:1fr auto;gap:9px 12px;margin-top:15px;padding-top:14px;border-top:1px dashed var(--line)}
  .kv dt{color:var(--muted);font-size:13.5px}
  .kv dd{margin:0;text-align:right;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
  .kv dd.hl{color:var(--brand)}

  .err{background:var(--crit-bg);color:var(--crit-ink);border-radius:12px;
    padding:12px 14px;font-size:13.5px;font-weight:600;margin-top:14px}

  .foot{margin-top:26px;text-align:center}
  .foot img{width:76px;height:76px;opacity:.95}
  .foot p{color:var(--muted);font-size:11.5px;margin:10px 0 0;line-height:1.6}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="tabs" role="tablist" aria-label="Modo da calculadora">
    <button class="tab" id="tab-estoque" role="tab" aria-selected="true" aria-controls="pane-estoque">📦 Estoque</button>
    <button class="tab" id="tab-dosagem" role="tab" aria-selected="false" aria-controls="pane-dosagem">💧 Dosagem</button>
  </div>

  <!-- ESTOQUE -->
  <section id="pane-estoque" role="tabpanel" aria-labelledby="tab-estoque" class="card">
    <div class="grp">
      <label for="e-marca">Marca / Produto</label>
      <select id="e-marca"></select>
      <div class="hint" id="e-gpm-hint"></div>
    </div>
    <div class="grp">
      <label for="e-data">Data de início</label>
      <input type="date" id="e-data">
    </div>
    <div class="row2 grp">
      <div>
        <label for="e-vol">Vol. por frasco (mL)</label>
        <input type="number" id="e-vol" inputmode="decimal" min="0" step="any" value="60">
      </div>
      <div>
        <label for="e-frascos">Qtd. de frascos</label>
        <input type="number" id="e-frascos" inputmode="numeric" min="0" step="any" value="1">
      </div>
    </div>
    <div class="row2 grp">
      <div>
        <label for="e-dose">Dose por vez</label>
        <input type="number" id="e-dose" inputmode="decimal" min="0" step="any" placeholder="Ex: 10" value="10">
      </div>
      <div>
        <label for="e-unid">Unidade</label>
        <select id="e-unid"><option value="gotas">Gotas</option><option value="ml">mL</option></select>
      </div>
    </div>
    <div class="grp">
      <label for="e-vezes">Vezes ao dia</label>
      <input type="number" id="e-vezes" inputmode="numeric" min="0" step="any" value="2">
      <div class="hint">Alerta de recompra: 45 dias de antecedência (padrão do Cuidado Continuado).</div>
    </div>
    <button class="cta" id="e-calc">Calcular recompra</button>
    <div id="e-out" aria-live="polite"></div>
  </section>

  <!-- DOSAGEM -->
  <section id="pane-dosagem" role="tabpanel" aria-labelledby="tab-dosagem" class="card" hidden>
    <div class="panel">
      <p class="panel-title">1 · Configuração do frasco</p>
      <div class="grp">
        <label for="d-marca">Marca / Produto</label>
        <select id="d-marca"></select>
        <div class="hint" id="d-gpm-hint"></div>
      </div>
      <div class="row2">
        <div>
          <label for="d-mg">Total de mg no frasco</label>
          <input type="number" id="d-mg" inputmode="decimal" min="0" step="any" placeholder="Ex: 6000" value="6000">
        </div>
        <div>
          <label for="d-ml">Total de mL no frasco</label>
          <input type="number" id="d-ml" inputmode="decimal" min="0" step="any" placeholder="Ex: 30" value="30">
        </div>
      </div>
      <div class="hint" id="d-conc"></div>
    </div>

    <div class="grp">
      <label for="d-mgdose" style="color:var(--brand)">Opção A · Prescrição em mg → dose</label>
      <input type="number" id="d-mgdose" inputmode="decimal" min="0" step="any" placeholder="Dose em mg (Ex: 50)">
    </div>
    <button class="cta" id="d-calcA">Converter mg para gotas / mL</button>
    <div id="d-outA" aria-live="polite"></div>

    <div class="divider">OU</div>

    <div class="grp">
      <label for="d-qtd" style="color:var(--brand)">Opção B · Dose que já toma → mg</label>
      <div class="row2">
        <input type="number" id="d-qtd" inputmode="decimal" min="0" step="any" placeholder="Quantidade">
        <select id="d-qtdunid"><option value="gotas">Gotas</option><option value="ml">mL</option></select>
      </div>
    </div>
    <button class="cta soft" id="d-calcB">Descobrir quantos mg</button>
    <div id="d-outB" aria-live="polite"></div>
  </section>

    {n:"Pangaia",g:42},
    {n:"Rare",g:75},
    {n:"Reuni",g:40},
    {n:"SativaMed",g:30},
    {n:"Sensia",g:45},
    {n:"Sphera Joy",g:42},
    {n:"UB Super",g:52},
    {n:"USAHemp",g:43},
    {n:"Valtellinamed",g:40},
    {n:"Outros (padrão)",g:40}
  ];

  var $=function(id){return document.getElementById(id);};
  function fillSelect(sel,defName){
    BRANDS.forEach(function(b,i){
      var o=document.createElement("option");
      o.value=String(i); o.textContent=b.n+" · "+b.g+" gts/mL";
      sel.appendChild(o);
    });
    var di=BRANDS.findIndex(function(b){return b.n===defName;});
    sel.value=String(di>=0?di:0);
  }
  function gpmOf(sel){return BRANDS[parseInt(sel.value,10)||0].g;}
  function num(id){var v=parseFloat($(id).value.replace(",","."));return isNaN(v)?null:v;}
  function fmtN(x,d){if(d===undefined)d=1;var r=Math.round(x*Math.pow(10,d))/Math.pow(10,d);
    return r.toLocaleString("pt-BR",{maximumFractionDigits:d});}
  function fmtDate(dt){return dt.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});}
  function addDays(dt,n){var d=new Date(dt.getTime());d.setDate(d.getDate()+n);return d;}
  function daysBetween(a,b){var MS=86400000;
    var a0=new Date(a.getFullYear(),a.getMonth(),a.getDate());
    var b0=new Date(b.getFullYear(),b.getMonth(),b.getDate());
    return Math.round((b0-a0)/MS);}
  function plural(n,s,p){return n===1?s:p;}

  var tE=$("tab-estoque"),tD=$("tab-dosagem"),pE=$("pane-estoque"),pD=$("pane-dosagem");
  function selTab(which){
    var e=which==="estoque";
    tE.setAttribute("aria-selected",e?"true":"false");
    tD.setAttribute("aria-selected",e?"false":"true");
    pE.hidden=!e; pD.hidden=e;
  }
  tE.addEventListener("click",function(){selTab("estoque");});
  tD.addEventListener("click",function(){selTab("dosagem");});

  var root=document.documentElement;
  try{var saved=localStorage.getItem("cc-theme");if(saved)root.setAttribute("data-theme",saved);}catch(e){}
  $("themeToggle").addEventListener("click",function(){
    var cur=root.getAttribute("data-theme");
    var isDark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme:dark)").matches;
    var next=isDark?"light":"dark";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem("cc-theme",next);}catch(e){}
  });

  fillSelect($("e-marca"),"Canna River");
  fillSelect($("d-marca"),"Canna River");
  function updGpmHint(sel,hintId){$(hintId).textContent="≈ "+gpmOf(sel)+" gotas por mL";}
  updGpmHint($("e-marca"),"e-gpm-hint");
  $("e-marca").addEventListener("change",function(){updGpmHint($("e-marca"),"e-gpm-hint");calcEstoque();});
  (function(){var t=new Date();var iso=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");$("e-data").value=iso;})();

  function calcEstoque(){
    var out=$("e-out");
    var gpm=gpmOf($("e-marca"));
    var vol=num("e-vol"),fr=num("e-frascos"),dose=num("e-dose"),vezes=num("e-vezes");
    var antec=45; // padrão fixo do Cuidado Continuado (D-45)
    var unid=$("e-unid").value, dataVal=$("e-data").value;
    if(vol===null||fr===null||dose===null||vezes===null||vol<=0||fr<=0||dose<=0||vezes<=0){
      out.innerHTML='<div class="err">Preencha volume, frascos, dose e vezes ao dia com valores maiores que zero.</div>';return;}
    var totalGotas=vol*fr*gpm;
    var doseGotas=unid==="ml"?dose*gpm:dose;
    var consumoDia=doseGotas*vezes;
    var duracao=totalGotas/consumoDia;
    var durInt=Math.floor(duracao);

    var html="";
    var kv='<dl class="kv">'+
      '<dt>Duração do estoque</dt><dd class="hl">'+fmtN(duracao,0)+' '+plural(durInt,"dia","dias")+'</dd>'+
      '<dt>Consumo diário</dt><dd>'+fmtN(consumoDia,1)+' gotas/dia</dd>'+
      '<dt>Total no estoque</dt><dd>'+fmtN(totalGotas,0)+' gotas · '+fmtN(vol*fr,0)+' mL</dd>';

    if(dataVal){
      var d0=new Date(dataVal+"T00:00:00");
      var fim=addDays(d0,duracao);
      var aviso=addDays(fim,-antec);
      var hoje=new Date();
      var restam=daysBetween(hoje,fim);
      var stClass,stText,bigNum,bigUnit,bigCrit="";
      if(restam<0){
        stClass="st-crit";stText="Estoque esgotado";bigCrit=" crit";
        bigNum=Math.abs(restam);bigUnit="dias atrás acabou";
      }else if(daysBetween(hoje,aviso)<=0){
        stClass="st-warn";stText="Hora de avisar / iniciar recompra";
        bigNum=restam;bigUnit=plural(restam,"dia restante","dias restantes");
      }else{
        stClass="st-ok";stText="Estoque em dia";
        bigNum=restam;bigUnit=plural(restam,"dia restante","dias restantes");
      }
      kv+='<dt>Fim do estoque</dt><dd>'+fmtDate(fim)+'</dd>'+
          '<dt>Avisar até (D-'+antec+')</dt><dd class="hl">'+fmtDate(aviso)+'</dd>';
      html='<div class="result">'+
        '<div class="result-status '+stClass+'"><span class="dot"></span>'+stText+'</div>'+
        '<div class="result-body">'+
          '<div class="big'+bigCrit+'"><span class="num">'+fmtN(bigNum,0)+'</span><span class="unit">'+bigUnit+'</span></div>'+
          kv+'</dl>'+
        '</div></div>';
    }else{
      html='<div class="result"><div class="result-body">'+
        '<div class="big"><span class="num">'+fmtN(duracao,0)+'</span><span class="unit">'+plural(durInt,"dia de duração","dias de duração")+'</span></div>'+
        kv+'</dl><div class="hint" style="margin-top:12px">Informe a data de início para ver o fim do estoque e o alerta de recompra.</div>'+
        '</div></div>';
    }
    out.innerHTML=html;
  }
  $("e-calc").addEventListener("click",calcEstoque);
  ["e-vol","e-frascos","e-dose","e-vezes","e-unid","e-data"].forEach(function(id){
    $(id).addEventListener("change",calcEstoque);});

  function concInfo(){
    var mg=num("d-mg"),ml=num("d-ml"),gpm=gpmOf($("d-marca"));
    if(mg&&ml&&mg>0&&ml>0){
      var mgml=mg/ml, mggota=mgml/gpm;
      $("d-conc").textContent="Concentração: "+fmtN(mgml,2)+" mg/mL · "+fmtN(mggota,3)+" mg por gota";
      return {mgml:mgml,mggota:mggota,gpm:gpm};
    }
    $("d-conc").textContent="Preencha mg e mL do frasco para ver a concentração.";
    return null;
  }
  function updDgpm(){$("d-gpm-hint").textContent="≈ "+gpmOf($("d-marca"))+" gotas por mL";concInfo();}
  updDgpm();
  $("d-marca").addEventListener("change",function(){updDgpm();});
  ["d-mg","d-ml"].forEach(function(id){$(id).addEventListener("input",concInfo);});

  $("d-calcA").addEventListener("click",function(){
    var out=$("d-outA");var c=concInfo();var dmg=num("d-mgdose");
    if(!c){out.innerHTML='<div class="err">Preencha mg e mL do frasco primeiro.</div>';return;}
    if(dmg===null||dmg<=0){out.innerHTML='<div class="err">Informe a dose em mg.</div>';return;}
    var ml=dmg/c.mgml, gotas=dmg/c.mggota;
    out.innerHTML='<div class="result"><div class="result-body">'+
      '<div class="big"><span class="num">'+fmtN(gotas,1)+'</span><span class="unit">gotas</span></div>'+
      '<dl class="kv"><dt>Equivale a</dt><dd class="hl">'+fmtN(ml,2)+' mL</dd>'+
      '<dt>Dose prescrita</dt><dd>'+fmtN(dmg,1)+' mg</dd></dl>'+
      '</div></div>';
  });

  $("d-calcB").addEventListener("click",function(){
    var out=$("d-outB");var c=concInfo();var q=num("d-qtd");var u=$("d-qtdunid").value;
    if(!c){out.innerHTML='<div class="err">Preencha mg e mL do frasco primeiro.</div>';return;}
    if(q===null||q<=0){out.innerHTML='<div class="err">Informe a quantidade.</div>';return;}
    var mg=u==="ml"?q*c.mgml:q*c.mggota;
    out.innerHTML='<div class="result"><div class="result-body">'+
      '<div class="big"><span class="num">'+fmtN(mg,1)+'</span><span class="unit">mg</span></div>'+
      '<dl class="kv"><dt>A partir de</dt><dd class="hl">'+fmtN(q,1)+' '+(u==="ml"?"mL":"gotas")+'</dd></dl>'+
      '</div></div>';
  });

  calcEstoque();
})();
</script>

</body>
</html>
